<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minik Planım</title><link rel="stylesheet" href="style.css"></head><body><div class="uygulama"><div class="pencere"><header class="ust-menu"><div class="marka"><span class="logo">🌷</span><b>minik planım</b></div><small>♡ Öğrenme yolculuğun için kişisel takvim</small><button id="ekleButonu" class="ana-buton">+ Yeni ekle</button></header><div class="sayfa-icerik"><main class="takvim-alani"><div class="ay-basligi"><h1 id="ayYazisi"></h1><div class="ay-gecisleri"><button id="oncekiAy" aria-label="Önceki ay">‹</button><button id="bugunButonu" aria-label="Bugüne git">●</button><button id="sonrakiAy" aria-label="Sonraki ay">›</button></div></div><div class="hafta-gunleri"><span>Pzt</span><span>Sal</span><span>Çar</span><span>Per</span><span>Cum</span><span>Cmt</span><span>Paz</span></div><div id="takvim" class="takvim"></div></main><aside class="gunluk-plan"><span id="secilenTarih" class="tarih-etiketi"></span><h2 id="planBasligi">Günün planı</h2><div id="odakKutusu" class="odak-kutusu"></div><ul id="planListesi" class="plan-listesi"></ul><p id="bosMesaj" class="bos-mesaj">Bu gün için henüz bir plan yok.</p></aside></div><footer>✦ Verilerin sadece bu tarayıcıda saklanır.</footer></div></div><dialog id="eklemePenceresi"><form id="planFormu"><h2>Planına ekle ✨</h2><label>Başlık<input id="baslik" required maxlength="60" placeholder="Örn. Python tekrar"></label><label>Tarih<input id="tarih" type="date" required></label><label>Saat (isteğe bağlı)<input id="saat" type="time"></label><label>Tür<select id="tur"><option value="study">Çalışma</option><option value="event">Etkinlik</option><option value="personal">Kişisel</option></select></label><div class="form-butonlari"><button id="iptalButonu" class="iptal" type="button">Vazgeç</button><button class="ana-buton" type="submit">Kaydet</button></div></form></dialog><script src="app.js"></script></body></html>
